name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unlock git-crypt
        env:
          GIT_CRYPT_KEY_BASE64: ${{ secrets.GIT_CRYPT_KEY_BASE64 }}
        run: |
          if ! command -v git-crypt >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq git-crypt
          fi
          if [ -z "$GIT_CRYPT_KEY_BASE64" ]; then
            echo "::error::未配置 secrets.GIT_CRYPT_KEY_BASE64"
            exit 1
          fi
          echo "$GIT_CRYPT_KEY_BASE64" | base64 -d > /tmp/git-crypt.key
          git-crypt unlock /tmp/git-crypt.key
          rm -f /tmp/git-crypt.key

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Tests
        run: npm run test:run

      - name: Desktop type check
        run: npm run type-check

      - name: Mobile type check
        run: npm --prefix mobile run type-check

      - name: Mobile test type check
        run: npm --prefix mobile run type-check:test

  builds:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unlock git-crypt
        env:
          GIT_CRYPT_KEY_BASE64: ${{ secrets.GIT_CRYPT_KEY_BASE64 }}
        run: |
          if ! command -v git-crypt >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq git-crypt
          fi
          echo "$GIT_CRYPT_KEY_BASE64" | base64 -d > /tmp/git-crypt.key
          git-crypt unlock /tmp/git-crypt.key
          rm -f /tmp/git-crypt.key

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: uTools build
        run: npm run build-only

      - name: Web build
        run: npm run build:web

      - name: Electron build
        run: npm run build:electron

      - name: WeChat mini program build
        run: npm run build:mp-weixin
